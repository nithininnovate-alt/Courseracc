    ResultInput:
      type: object
      required: [userId, examId, score]
      properties:
        userId: { type: integer }
        examId: { type: integer }
        score: { type: number, minimum: 0 }
        grade: { type: string }
        passed: { type: boolean }
        remarks: { type: string }
        published: { type: boolean }
    ResultUpdate:
      type: object
      properties:
        score: { type: number, minimum: 0 }
        grade: { type: string }
        passed: { type: boolean }
        remarks: { type: string }
        published: { type: boolean }

    Payment:
      type: object
