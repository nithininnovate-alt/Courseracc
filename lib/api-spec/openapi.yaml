    CertificateInput:
      type: object
      required: [userId, courseId, type]
      properties:
        userId: { type: integer }
        courseId: { type: integer }
        type: { type: string, enum: [degree, transcript] }

    EligibleRecipient:
      type: object
      required: [userId, fullName, email, courseId, courseTitle]
      properties:
        userId: { type: integer }
        fullName: { type: string }
        email: { type: string }
        courseId: { type: integer }
        courseTitle: { type: string }
        hasDegree: { type: boolean }
        hasTranscript: { type: boolean }

    EmailLog:
      type: object
      required: [id, recipient, subject, template, status, createdAt]
