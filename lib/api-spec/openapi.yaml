  /courier/{id}:
    patch:
      operationId: updateCourier
      tags: [courier]
      summary: Update a courier request (admin dispatch / status)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierUpdate"
      responses:
        "200":
          description: Updated courier record
          content:
