      properties:
        applicationsByStatus:
          type: array
          items: { $ref: "#/components/schemas/NameValue" }
        revenueByMonth:
          type: array
          items: { $ref: "#/components/schemas/NameValue" }
        enrollmentsByCourse:
          type: array
          items: { $ref: "#/components/schemas/NameValue" }
        examPassRates:
          type: array
          items:
