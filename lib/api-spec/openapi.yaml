        id: { type: ["integer", "null"] }
        examId: { type: integer }
        userId: { type: integer }
        status: { type: string, enum: [submitted, graded, not_submitted] }
        studentName: { type: ["string", "null"] }
        studentId: { type: ["string", "null"] }
        fileUrl: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        submittedAt: { type: ["string", "null"], format: date-time }
    ExamSubmissionInput:
      type: object
      required: [examId]
      properties:
        examId: { type: integer }
        fileUrl: { type: string }
        note: { type: string }

    Result:
