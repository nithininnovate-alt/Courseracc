openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Central Global University LMS/SMS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Staff (admin/superadmin) username + password authentication
  - name: users
    description: User accounts and roles
  - name: applications
    description: Online admission applications
  - name: courses
    description: Course catalog
  - name: subjects
    description: Course subjects/modules
  - name: enrollments
    description: Student enrollments
  - name: materials
    description: Study materials and lecture content
  - name: assignments
    description: Assignments and submissions
  - name: exams
    description: Examinations and results
  - name: payments
    description: Payments
  - name: certificates
    description: Certificates
  - name: emails
    description: Email automation logs
  - name: courier
    description: Certificate courier tracking
  - name: dashboard
    description: Dashboard summaries
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: staffLogin
      tags: [auth]
      summary: Staff login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: staffLogout
      tags: [auth]
      summary: Staff logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Update a user's role (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List admission applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit an admission application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"

  /courses/{courseId}/subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List subjects for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a subject for a course (admin)
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"

  /courses/{courseId}/access:
    get:
      operationId: getCourseAccess
      tags: [courses]
      summary: Check the current student's access to a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseAccess"

  /subjects/{id}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a subject by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update a subject (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Delete a subject (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"

  /subjects/{subjectId}/materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List study materials for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyMaterial"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Create a study material (admin)
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyMaterial"

  /materials/{id}:
    patch:
      operationId: updateMaterial
      tags: [materials]
      summary: Update a study material (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Updated material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyMaterial"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a study material (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"

  /progress:
    get:
      operationId: listProgress
      tags: [progress]
      summary: List the current student's material progress
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Material progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialProgress"
    post:
      operationId: recordProgress
      tags: [progress]
      summary: Record progress for a study material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialProgressInput"
      responses:
        "201":
          description: Recorded progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialProgress"

  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List the current student's enrollments
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
    post:
      operationId: createEnrollment
      tags: [enrollments]
      summary: Enroll in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Created enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get an assignment by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [assignments]
      summary: List the current student's submissions
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [assignments]
      summary: Submit an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Created submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /exams:
    get:
      operationId: listExams
      tags: [exams]
      summary: List exams
      responses:
        "200":
          description: Exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exam"

  /exams/{id}:
    get:
      operationId: getExam
      tags: [exams]
      summary: Get an exam by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"

  /results:
    get:
      operationId: listResults
      tags: [exams]
      summary: List the current student's results
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Result"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List the current student's payments
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/paypal/create-order:
    post:
      operationId: createPaypalOrder
      tags: [payments]
      summary: Create a PayPal order for a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaypalOrderInput"
      responses:
        "201":
          description: Created PayPal order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaypalOrderResponse"

  /payments/paypal/capture:
    post:
      operationId: capturePaypalOrder
      tags: [payments]
      summary: Capture an approved PayPal order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaypalCaptureInput"
      responses:
        "200":
          description: Captured payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List the current student's certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"

  /email-logs:
    get:
      operationId: listEmailLogs
      tags: [emails]
      summary: List email automation logs (admin)
      responses:
        "200":
          description: Email logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailLog"

  /courier:
    get:
      operationId: listCourierTracking
      tags: [courier]
      summary: List certificate courier tracking records
      responses:
        "200":
          description: Courier tracking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourierTracking"

  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Student dashboard summary
      responses:
        "200":
          description: Student dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: { type: integer }
        clerkId: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        email: { type: string }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        role: { type: string, enum: [student, admin, superadmin] }
        avatarUrl: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    UpdateProfileInput:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        dateOfBirth: { type: string }
        address: { type: string }
        country: { type: string }
        avatarUrl: { type: string }
    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [student, admin, superadmin] }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AuthMessage:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    ApplicationDocument:
      type: object
      required: [id, applicationId, name, objectPath, uploadedAt]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        name: { type: string }
        type: { type: ["string", "null"] }
        objectPath: { type: string }
        uploadedAt: { type: string, format: date-time }
    ApplicationDocumentInput:
      type: object
      required: [name, objectPath]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string }
        objectPath: { type: string, minLength: 1 }
    Application:
      type: object
      required: [id, userId, programName, fullName, email, status, submittedAt]
      properties:
        id: { type: integer }
        userId: { type: ["integer", "null"] }
        programName: { type: string }
        courseId: { type: ["integer", "null"] }
        fullName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        gender: { type: ["string", "null"] }
        nationality: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        previousQualification: { type: ["string", "null"] }
        previousInstitution: { type: ["string", "null"] }
        graduationYear: { type: ["string", "null"] }
        gradePercentage: { type: ["string", "null"] }
        status: { type: string, enum: [pending, under_review, approved, rejected] }
        reviewNote: { type: ["string", "null"] }
        documentsUrl: { type: ["string", "null"] }
        admissionLetterUrl: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        submittedAt: { type: string, format: date-time }
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDocument"
    ApplicationInput:
      type: object
      required: [programName, fullName, email]
      properties:
        programName: { type: string, minLength: 1 }
        courseId: { type: integer }
        fullName: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        phone: { type: string }
        dateOfBirth: { type: string }
        gender: { type: string }
        nationality: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        previousQualification: { type: string }
        previousInstitution: { type: string }
        graduationYear: { type: string }
        gradePercentage: { type: string }
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDocumentInput"
    ApplicationUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, under_review, approved, rejected] }
        reviewNote: { type: string }

    Course:
      type: object
