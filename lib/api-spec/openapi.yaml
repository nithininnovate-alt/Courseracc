  /ai/chat:
    post:
      operationId: sendChatMessage
      tags: [ai]
      summary: Stream an AI study-assistant response (student)
      description: >-
        Returns a Server-Sent Events stream of assistant tokens grounded in the
        student's enrolled courses and study materials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageInput"
      responses:
        "200":
          description: SSE stream of assistant tokens
          content:
            text/event-stream:
              schema:
                type: string

  /ai/explain:
    post:
      operationId: explainLesson
      tags: [ai]
      summary: Stream an AI explanation of a specific study material (student)
      description: >-
        Returns a Server-Sent Events stream of an assistant explanation focused
        on a single study material the student is currently viewing. The student
        must be enrolled in and have access to the course that owns the material
        (free courses, or a completed payment for paid courses).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainLessonInput"
      responses:
        "200":
          description: SSE stream of explanation tokens
          content:
            text/event-stream:
              schema:
                type: string

  /ai/explanations/{materialId}:
    get:
      operationId: getLessonExplanation
      tags: [ai]
      summary: Fetch the student's most recent saved AI explanation for a material
      description: >-
        Returns the last AI explanation the current student generated for the
        given study material, if any, so it can be shown again without
        re-calling the AI. Returns an empty result when none has been saved.
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The saved explanation, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonExplanationResult"

